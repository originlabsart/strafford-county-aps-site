<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v7" stroke="#2b211b" stroke-width="1.3" opacity=".5"/></pattern>
    <pattern id="h2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><path d="M0 0v5" stroke="#2b211b" stroke-width="1" opacity=".4"/></pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e6b63f" stop-opacity=".55"/><stop offset="1" stop-color="#e6b63f" stop-opacity="0"/></radialGradient>
    <radialGradient id="v" cx="50%" cy="50%" r="70%"><stop offset=".6" stop-color="#efe4cc" stop-opacity="0"/><stop offset="1" stop-color="#a9875a" stop-opacity=".45"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="#efe4cc"/>
  <!-- plank wall -->
  <g stroke="#2b211b" stroke-width="1.6" opacity=".5"><path d="M60 0V600M150 0V600M240 0V600M330 0V600M420 0V600M510 0V600M600 0V600M690 0V600M780 0V600"/></g>
  <g fill="#2b211b" opacity=".4"><circle cx="60" cy="40" r="3"/><circle cx="150" cy="40" r="3"/><circle cx="240" cy="40" r="3"/><circle cx="330" cy="40" r="3"/><circle cx="420" cy="40" r="3"/><circle cx="510" cy="40" r="3"/><circle cx="600" cy="40" r="3"/><circle cx="690" cy="40" r="3"/></g>
