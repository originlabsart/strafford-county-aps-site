  <path d="M496 120H560M496 200H560" stroke="#efe4cc" stroke-width="3" opacity=".5"/>
  <!-- stove body -->
  <rect x="380" y="300" width="300" height="250" rx="10" fill="#2b211b"/>
  <rect x="368" y="290" width="324" height="26" rx="6" fill="#2b211b"/>
  <rect x="420" y="350" width="140" height="140" rx="6" fill="#3d2f25" stroke="#7a6248" stroke-width="3"/>
  <path d="M440 470C450 430 470 440 478 410C488 440 500 420 508 450C514 430 526 440 538 470Z" fill="#e3922e"/>
  <path d="M458 470C466 446 478 452 484 436C490 452 500 446 506 470Z" fill="#e6b63f"/>
  <g stroke="#7a6248" stroke-width="3"><path d="M440 350V490M470 350V490M500 350V490M530 350V490"/></g>
  <rect x="580" y="410" width="30" height="10" rx="3" fill="#7a6248"/>
  <path d="M396 550L388 610H410L414 550M664 550L670 610H648L646 550" fill="#2b211b"/>
