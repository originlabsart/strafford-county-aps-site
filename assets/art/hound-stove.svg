    <ellipse cx="330" cy="790" rx="300" ry="96"/><ellipse cx="330" cy="790" rx="240" ry="64"/><ellipse cx="330" cy="790" rx="180" ry="32"/>
  </g>
  <!-- the hound, asleep -->
  <g transform="translate(120 650) scale(1.45)">
    <ellipse cx="160" cy="112" rx="150" ry="12" fill="#2b211b" opacity=".22"/>
    <path fill="#2b211b" d="M70 100C62 70 100 50 160 48C220 46 262 60 272 86C278 100 270 110 256 110H84C76 110 72 106 70 100Z"/>
    <path fill="#2b211b" d="M80 92C60 92 34 92 20 86C6 80 8 64 22 60C38 56 58 60 78 70Z"/>
