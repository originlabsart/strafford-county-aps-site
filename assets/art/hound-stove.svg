    <path fill="#2b211b" d="M150 100H210V110H148Z"/>
    <path fill="#4a3426" d="M52 62C40 70 38 92 46 104C56 100 62 86 60 66Z"/>
    <path d="M28 70C32 68 36 68 40 70" stroke="#e6b63f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M270 94C296 98 304 112 280 114" fill="none" stroke="#2b211b" stroke-width="7" stroke-linecap="round"/>
    <path d="M110 66C130 60 150 58 170 60M120 80C150 72 190 72 220 78" stroke="#5a4636" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M78 74C84 70 92 70 98 74" stroke="#8e2a1e" stroke-width="5" fill="none" stroke-linecap="round"/>
