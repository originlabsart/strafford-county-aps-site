  <g transform="translate(700 520)">
    <path d="M-10 0H96L86 90H0Z" fill="url(#h)" stroke="#2b211b" stroke-width="4"/>
    <circle cx="20" cy="-8" r="16" fill="#c5a77f" stroke="#2b211b" stroke-width="4"/><circle cx="54" cy="-14" r="18" fill="#c5a77f" stroke="#2b211b" stroke-width="4"/><circle cx="80" cy="-4" r="13" fill="#c5a77f" stroke="#2b211b" stroke-width="4"/>
    <circle cx="20" cy="-8" r="6" fill="none" stroke="#2b211b" stroke-width="2"/><circle cx="54" cy="-14" r="7" fill="none" stroke="#2b211b" stroke-width="2"/>
  </g>
  <!-- braided rug -->
  <g fill="none" stroke-width="16">
    <ellipse cx="330" cy="790" rx="300" ry="96" stroke="#8e2a1e"/>
    <ellipse cx="330" cy="790" rx="270" ry="80" stroke="#c5a77f"/>
    <ellipse cx="330" cy="790" rx="240" ry="64" stroke="#2f4a35"/>
