  <!-- zzz drawn as three small leaves? keep quiet: a curl of warmth -->
  <path d="M470 280C460 250 486 236 474 206C466 186 482 172 478 150" fill="none" stroke="#2b211b" stroke-width="2" opacity=".35" stroke-linecap="round"/>
  <rect width="800" height="1000" fill="url(#v)"/>
